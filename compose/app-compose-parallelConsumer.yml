services:
  app:
    image: kafka-batch-bottleneck-app:latest
    depends_on:
      - kafka
      - mockServer
    environment:
      SPRING_PROFILES_ACTIVE: parallelConsumer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 50
      AUTH_SERVICE_BASE_URL: http://mockServer:1080
    ports:
      - "8080:8080"
